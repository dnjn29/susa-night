<title>수산 궁의 밤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@300;400;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">

<style>
/* 레이아웃 — 유약 벽돌 패널 한 장이 가운데 서고, 머리에 네 가지 숫자,
   발치에 점토판 같은 선택지가 놓인다. 수산 궁의 밤에 맞춘 단일 암야 테마. */
:root{
  --night:#09081a;
  --brick:#14122c;
  --brick-2:#1d1a3c;
  --gold:#c8a23c;
  --gold-2:#f2d98c;
  --ox:#9b2b33;
  --ash:#6f6a7e;
  --linen:#ece5d4;
  --dim:#9d937c;
  --line:rgba(200,162,60,.22);
  --display:'Gowun Batang', 'Nanum Myeongjo', serif;
  --body:'Noto Serif KR', 'Gowun Batang', serif;
  --ui:'IBM Plex Sans KR', system-ui, sans-serif;
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(120% 90% at 50% -10%, rgba(44,74,160,.30), transparent 60%),
    radial-gradient(80% 60% at 50% 110%, rgba(155,43,51,.16), transparent 65%),
    var(--night);
  color:var(--linen);
  font-family:var(--body);
  font-weight:300;
  line-height:1.95;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:30;background:var(--night);
}

.wrap{
  max-width:58rem;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:0 3rem;
}

/* ── 상단 숫자판 ───────────────────────────────── */
.crown{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:linear-gradient(180deg, var(--night) 74%, rgba(9,8,26,0));
  padding-block:.75rem .9rem;
}
.crown[hidden]{display:none!important}
.crown-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem}
.act-mark{font-family:var(--ui);font-size:.74rem;letter-spacing:.14em;color:var(--dim);white-space:nowrap}
.act-mark b{color:var(--gold-2);font-weight:600}
.pips{display:flex;gap:4px;margin-inline-start:auto}
.pip{width:7px;height:7px;transform:rotate(45deg);background:rgba(236,229,212,.16)}
.pip.on{background:var(--gold)}
.pip.now{background:var(--gold-2);box-shadow:0 0 0 2px rgba(242,217,140,.2)}

.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.45rem;margin-top:.7rem}
.meter{
  all:unset;display:block;cursor:help;min-width:0;position:relative;
  border:1px solid var(--line);background:rgba(20,18,44,.8);
  padding:.45rem .55rem .55rem;
}
.meter:hover,.meter:focus-visible{border-color:var(--gold)}
.meter:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.meter .nm{font-family:var(--ui);font-size:.72rem;color:var(--linen)}
.meter .val{float:right;font-family:var(--ui);font-size:.82rem;font-weight:600;color:var(--gold-2);font-variant-numeric:tabular-nums}
.bar{height:4px;background:rgba(236,229,212,.12);margin-top:.45rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .5s cubic-bezier(.2,.7,.3,1)}
.meter.danger .val{color:#eb8d8d}
.meter.danger .bar i{background:var(--ox)}
.delta{
  position:absolute;right:.5rem;top:-.4rem;font-family:var(--ui);font-size:.74rem;
  font-weight:600;color:var(--gold-2);animation:rise 1.9s ease-out forwards;pointer-events:none;
}
.delta.down{color:#eb8d8d}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}

/* ── 본문 ─────────────────────────────────────── */
.panel{
  border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(29,26,60,.85), rgba(20,18,44,.92));
  padding:clamp(1.3rem,4vw,2.6rem);position:relative;
}
.panel::after{content:"";position:absolute;inset:6px;border:1px solid rgba(200,162,60,.1);pointer-events:none}
.scene-title{font-family:var(--ui);font-size:.74rem;letter-spacing:.26em;color:var(--gold);margin:0 0 1.3rem}
.passage p{margin:0 0 1.1rem;max-width:40rem;animation:fade .7s ease-out both}
.passage p:last-child{margin-bottom:0}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.passage .echo{color:var(--dim);border-left:2px solid var(--line);padding-left:1rem;font-size:.96rem}
.passage .said{
  font-family:var(--display);font-size:1.14rem;line-height:1.8;color:var(--gold-2);
  border-inline-start:2px solid var(--gold);padding-inline-start:1rem;margin-block:1.4rem;
}
.passage .said b{
  display:block;font-family:var(--ui);font-size:.72rem;font-weight:600;
  letter-spacing:.14em;color:var(--dim);margin-bottom:.3rem;
}
.passage .tip{border:1px solid var(--line);background:rgba(44,74,160,.16);padding:.85rem 1.05rem;font-size:.94rem}
.passage .tip b{color:var(--gold-2);font-weight:600}
.passage .must{
  border:1px solid rgba(235,141,141,.5);background:rgba(155,43,51,.15);
  padding:.9rem 1.1rem;font-size:.94rem;
}
.passage .must b{color:#eb8d8d;font-weight:600}
.passage .quote{
  font-family:var(--display);font-size:1.08rem;color:var(--linen);
  background:rgba(200,162,60,.07);border:1px solid var(--line);padding:.9rem 1.1rem;
}
.passage .quote em{display:block;font-family:var(--ui);font-size:.72rem;font-style:normal;color:var(--dim);margin-top:.5rem}

.bible{
  font-family:var(--ui);font-size:.8rem;line-height:1.75;color:var(--dim);
  border-top:1px solid var(--line);padding-top:.85rem;margin-top:.4rem;
}
.bible b{color:var(--gold);font-weight:600}
.bnote{
  font-family:var(--ui);font-size:.84rem;line-height:1.7;
  border:1px solid rgba(63,156,149,.4);background:rgba(63,156,149,.1);
  padding:.75rem 1rem;color:var(--linen);
}
.bnote b{color:#7fd8d0;font-weight:600;display:block;margin-bottom:.15rem}
.bnote.same{border-color:rgba(200,162,60,.45);background:rgba(200,162,60,.1)}
.bnote.same b{color:var(--gold-2)}

.gl{font-weight:400;color:var(--gold-2);border-bottom:1px dotted var(--gold);cursor:pointer}
.gl:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}

/* ── 선택지 ───────────────────────────────────── */
.choices{display:grid;gap:.6rem;margin-top:2.1rem}
.choice{
  all:unset;display:block;cursor:pointer;min-width:0;
  border:1px solid var(--line);background:rgba(9,8,26,.55);
  padding:.95rem 1.1rem;font-family:var(--body);font-size:1rem;line-height:1.65;
  color:var(--linen);transition:border-color .2s, background .2s, transform .2s;
  animation:fade .5s ease-out both;
}
.choice:hover,.choice:focus-visible{border-color:var(--gold);background:rgba(44,74,160,.22);transform:translateX(3px)}
.choice:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.choice .tag{display:block;font-family:var(--ui);font-size:.7rem;letter-spacing:.12em;color:var(--gold);margin-bottom:.3rem}
.fx{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem}
.fx span{font-family:var(--ui);font-size:.68rem;border:1px solid rgba(200,162,60,.35);color:var(--gold-2);padding:.1rem .45rem}
.fx span.down{border-color:rgba(235,141,141,.4);color:#eb8d8d}
.choice.locked{cursor:not-allowed;opacity:.5;border-style:dashed}
.choice.locked:hover{transform:none;background:rgba(9,8,26,.55);border-color:var(--line)}
.choice.locked .tag{color:var(--ox)}
.choice.go{text-align:center;font-family:var(--ui);font-size:.82rem;letter-spacing:.2em;color:var(--gold-2)}
.choice.restart{border-color:var(--gold);background:rgba(200,162,60,.1);text-align:center;font-family:var(--ui);letter-spacing:.1em}

/* ── 막 전환 ──────────────────────────────────── */
.curtain{
  position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow:auto;
  background:var(--night);cursor:pointer;
  padding-block:calc(env(safe-area-inset-top,0px) + 1.5rem) 2rem;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.curtain[hidden]{display:none!important}
.curtain .in{text-align:center;animation:fade 1s ease-out both;max-width:32rem}
.curtain .no{font-family:var(--ui);font-size:.76rem;letter-spacing:.38em;color:var(--gold)}
.curtain h2{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,7vw,3rem);margin:.7rem 0 0;text-wrap:balance}
.curtain .ref{font-family:var(--ui);font-size:.74rem;letter-spacing:.1em;color:var(--dim);margin-top:.8rem}
.curtain .reading{
  border:1px solid var(--line);padding:.9rem 1.1rem;margin-top:1.8rem;
  font-family:var(--ui);font-size:.82rem;line-height:1.8;color:var(--linen);text-align:left;
}
.curtain .reading b{color:var(--gold-2);font-weight:600}
.curtain .skip{font-family:var(--ui);font-size:.68rem;letter-spacing:.2em;color:rgba(157,147,124,.6);margin-top:1.6rem}

.rosette{width:clamp(56px,14vw,84px);height:auto;color:var(--gold);opacity:.85;margin-bottom:1.3rem}

/* ── 표제 ─────────────────────────────────────── */
.title-screen{text-align:center;padding-block:clamp(1.6rem,7vw,4rem) 2rem;animation:fade 1.1s ease-out both}
.title-screen h1{
  font-family:var(--display);font-weight:700;margin:0;
  font-size:clamp(2.6rem,11vw,4.4rem);letter-spacing:.06em;
  text-shadow:0 0 36px rgba(200,162,60,.22);
}
.title-screen .sub{font-family:var(--ui);font-size:.78rem;letter-spacing:.26em;color:var(--gold);margin-top:1rem}
.intro{max-width:34rem;margin:2.2rem auto 0;text-align:left}
.intro p{margin:0 0 1rem;font-size:1rem}
.intro p:last-child{margin-bottom:0}
.menu{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:2.4rem}
.btn{
  all:unset;cursor:pointer;border:1px solid var(--gold);color:var(--gold-2);
  font-family:var(--ui);font-size:.82rem;letter-spacing:.14em;padding:.8rem 1.5rem;
  transition:background .2s,color .2s;text-align:center;
}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--night)}
.btn:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
.btn.quiet{border-color:var(--line);color:var(--dim)}
.btn.quiet:hover,.btn.quiet:focus-visible{background:rgba(236,229,212,.08);color:var(--linen)}

/* ── 도구 ─────────────────────────────────────── */
.tools{display:flex;gap:.9rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}
.tool{
  all:unset;cursor:pointer;font-family:var(--ui);font-size:.74rem;color:var(--dim);
  border-bottom:1px solid transparent;padding:.2rem 0;
}
.tool:hover,.tool:focus-visible{color:var(--gold-2);border-color:var(--gold)}
.tool:focus-visible{outline:none}

/* ── 서랍 ─────────────────────────────────────── */
.drawer{
  position:fixed;inset:0;z-index:50;background:rgba(9,8,26,.92);overflow:auto;
  display:grid;place-items:start center;
  padding-block:calc(env(safe-area-inset-top,0px) + 2rem) 3rem;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.drawer[hidden]{display:none!important}
.drawer .sheet{width:min(44rem,100%);border:1px solid var(--line);background:var(--brick);padding:clamp(1.2rem,4vw,2rem)}
.drawer h3{font-family:var(--ui);font-size:.8rem;letter-spacing:.22em;color:var(--gold);margin:0 0 1.3rem}
.drawer p{font-size:.96rem}
.rulebox{border:1px solid var(--line);padding:1rem 1.1rem;margin-bottom:1rem}
.rulebox h4{font-family:var(--display);font-size:1.12rem;margin:0 0 .5rem;color:var(--gold-2)}
.rulebox p{margin:0 0 .5rem}
.rulebox p:last-child{margin-bottom:0}
.rulebox .mini{font-family:var(--ui);font-size:.74rem;color:var(--dim)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.log li{display:grid;grid-template-columns:4rem 1fr;gap:.8rem;font-size:.94rem;align-items:baseline}
.log .when{font-family:var(--ui);font-size:.72rem;color:var(--gold);min-width:0}
.log .what{min-width:0}
.log .ok{color:var(--gold-2)}
.log .no{color:#eb8d8d}
.dict{display:grid;gap:.75rem;margin:0;padding:0}
.dict div{min-width:0}
.dict dt{font-family:var(--display);font-size:1.04rem;color:var(--gold-2)}
.dict dd{margin:.15rem 0 0;font-size:.94rem;color:var(--dim)}
.dict dd .ref{font-family:var(--ui);font-size:.76rem;color:var(--gold);display:block;margin-top:.2rem}
.note{border-top:1px solid var(--line);padding-top:1rem;margin-top:1rem}
.note:first-of-type{border-top:0;padding-top:0;margin-top:0}
.note h4{font-family:var(--display);font-size:1.06rem;margin:0 0 .4rem;color:var(--gold-2)}
.note p{margin:0;font-size:.94rem;color:var(--dim);max-width:40rem}
.empty{color:var(--dim);font-size:.94rem;margin:0}

/* ── 낱말 말풍선 ──────────────────────────────── */
.pop{
  position:fixed;z-index:60;max-width:min(21rem,calc(100vw - 32px));
  border:1px solid var(--gold);background:var(--brick-2);
  padding:.7rem .9rem;font-size:.92rem;line-height:1.7;color:var(--linen);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.pop[hidden]{display:none!important}
.pop b{display:block;font-family:var(--display);color:var(--gold-2);margin-bottom:.2rem}
.pop .ref{display:block;font-family:var(--ui);font-size:.76rem;color:var(--gold);margin-top:.35rem}

/* ── 결말 ─────────────────────────────────────── */
.ending{animation:fade 1.2s ease-out both}
.stamp{
  display:block;width:fit-content;margin:0 auto 1.4rem;
  font-family:var(--ui);font-size:.74rem;letter-spacing:.2em;
  border:2px solid var(--gold);color:var(--gold-2);padding:.45rem 1.1rem;
  transform:rotate(-2deg);
}
.stamp.off{border-color:var(--ash);color:var(--ash)}
.over{
  text-align:center;font-family:var(--ui);font-size:.92rem;letter-spacing:.3em;
  color:#eb8d8d;border-block:1px solid rgba(235,141,141,.35);
  padding-block:.8rem;margin-bottom:1.6rem;
}
.ending .kicker{font-family:var(--ui);font-size:.74rem;letter-spacing:.26em;color:var(--gold);text-align:center}
.ending h2{font-family:var(--display);font-weight:700;text-align:center;text-wrap:balance;font-size:clamp(2rem,8vw,3.1rem);margin:.8rem 0 1.5rem}
.ending.sad h2{color:#e8d9d9}
.ending .epi{text-align:center;font-family:var(--display);font-size:1.1rem;color:var(--gold-2);max-width:32rem;margin:0 auto 2.4rem}
.says{border:1px solid rgba(63,156,149,.45);background:rgba(63,156,149,.08);padding:1.1rem 1.2rem;margin-top:2.2rem}
.says h4{font-family:var(--ui);font-size:.78rem;letter-spacing:.16em;color:#7fd8d0;margin:0 0 .7rem}
.says p{margin:0 0 .6rem;font-size:.96rem}
.says p:last-child{margin-bottom:0}
.says .ref{font-family:var(--ui);font-size:.8rem;color:var(--gold)}
.why{border:1px solid var(--line);padding:1.1rem 1.2rem;margin-top:1.2rem}
.why h4{font-family:var(--ui);font-size:.76rem;letter-spacing:.18em;color:var(--gold);margin:0 0 .9rem}
.why ul{margin:0;padding-left:1.1rem;display:grid;gap:.45rem}
.why li{font-size:.95rem}
.why li b{color:var(--gold-2);font-weight:600}
.why li.no b{color:#eb8d8d}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));gap:.6rem;margin-top:1.2rem}
.tally div{border:1px solid var(--line);padding:.7rem .8rem;min-width:0}
.tally .k{font-family:var(--ui);font-size:.7rem;color:var(--dim);display:block}
.tally .v{font-family:var(--display);font-size:1.5rem;color:var(--gold-2);font-variant-numeric:tabular-nums}

@media (max-width:560px){
  .meters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .log li{grid-template-columns:1fr}
  .log .when{margin-bottom:-.3rem}
  .btn{flex:1 1 9rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

<div class="wrap">
  <header class="crown" id="crown" hidden>
    <div class="crown-row">
      <span class="act-mark" id="actMark"></span>
      <span class="pips" id="pips"></span>
    </div>
    <div class="meters" id="meters"></div>
  </header>

  <main id="stage"></main>

  <div class="tools" id="tools" hidden>
    <button class="tool" id="btnHow">게임 방법</button>
    <button class="tool" id="btnDict">낱말 사전</button>
    <button class="tool" id="btnLog">내 기록</button>
    <button class="tool" id="btnNote">진짜 성경 이야기</button>
    <button class="tool" id="btnReset">처음부터</button>
  </div>
</div>

<div class="curtain" id="curtain" hidden></div>
<div class="pop" id="pop" hidden></div>

<div class="drawer" id="drawer" hidden>
  <div class="sheet">
    <h3 id="drawerTitle"></h3>
    <div id="drawerBody"></div>
    <div style="margin-top:1.8rem"><button class="btn quiet" id="drawerClose">닫기</button></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ───────────────────── 네 가지 숫자 ───────────────────── */
const STATS = [
  {k:'chong', name:'왕의 마음', desc:'왕이 너를 얼마나 아끼는지. 5막에서 왕 앞에 설 때 이 숫자가 필요하다.'},
  {k:'mang',  name:'궁궐 사람들', desc:'궁에서 네 편이 몇 명인지. 중요한 순간에 왕의 마음 대신 너를 받쳐 준다.'},
  {k:'dam',   name:'용기', desc:'목숨을 걸 수 있는 마음. 4막에서 이게 모자라면 그 말을 입 밖에 내지 못한다.'},
  {k:'ui',    name:'하만의 의심', desc:'하만이 네 비밀에 얼마나 가까이 왔는지. 이것만은 낮을수록 좋다.', danger:true}
];
const MAX = 12;

/* ───────────────────── 낱말 사전 ───────────────────── */
const DICT = [
  ['페르시아','지금의 이란 땅을 중심으로 서아시아를 다스리던 아주 큰 나라. 약 2500년 전 이야기다.', '에 1:1'],
  ['수산','페르시아의 수도 가운데 하나. 왕이 겨울을 보내던 큰 도시다.', '에 1:2'],
  ['아하수에로','페르시아 왕. 그리스 기록에는 크세르크세스라는 이름으로 나온다.', '에 1:1'],
  ['유대인','이스라엘 민족. 이때는 나라를 잃고 여러 나라에 흩어져 살았다. 성경에는 유다인이라고 적혀 있다.', '에 2:5'],
  ['모르드개','에스더의 사촌 오빠. 부모를 잃은 에스더를 키웠다.', '에 2:5-7'],
  ['하닷사','에스더의 유대인 이름. 도금양이라는 나무 뜻이다. 베어도 다시 자라는 나무.', '에 2:7'],
  ['에스더','페르시아 말로 별이라는 뜻. 밖에서 쓰는 이름이다.', '에 2:7'],

  c:[

     e:{}, to:'E.silence'}

/* ── 5막 ───────────────────────────────────────── */
'a5-1':{act:5, title:'안뜰',
  t:[
    P('사흘째 되는 날, 너는 왕비의 옷을 입는다. 사흘을 굶은 몸에 그 옷은 무겁다.'),
    P('왕궁 안뜰 맞은편에 선다. 왕은 저쪽 끝 자리에 앉아 문 쪽을 보고 있다.'),
    P('너와 왕 사이에는 금 지팡이를 든 손 하나와, 부르지 않은 사람을 죽이라는 법 하나가 놓여 있다.'),
    P('뜰을 지키는 사람들이 너를 본다. 아무도 막지 않는다. 막을 필요가 없기 때문이다. 법이 알아서 할 일이니까.'),
    st => {
      const hard = st.ui >= 4;
      const need = hard ? '왕의 마음 6 또는 궁궐 사람들 8' : '왕의 마음 4 또는 궁궐 사람들 6';
      const warn = hard ? ' 하만의 의심이 ' + st.ui + '까지 올라서, 그가 미리 왕에게 왕비 이야기를 나쁘게 해 두었다. 그래서 오늘은 더 어렵다.' : '';
      return '<span style="color:var(--gold-2)">지금 왕의 마음 ' + st.chong + ', 궁궐 사람들 ' + st.mang + '. 살아 나오려면 ' + need + '이 필요하다.' + warn + '</span>';
    },
    B('에스더 5:1', '제삼일에 왕후의 예복을 입고 안뜰에 선 대목')
  ],
  c:[{go:true, x:'안뜰로 걸어 들어간다',
      to: st => {
        const ok = st.ui >= 4 ? (st.chong >= 6 || st.mang >= 8) : (st.chong >= 4 || st.mang >= 6);
        return ok ? 'a5-2' : 'E.scepter';
      }}]},

'a5-2':{act:5, title:'금 지팡이', must:true,
  t:[
    P('왕이 뜰에 서 있는 왕비를 본다.'),
    P('그가 손에 들고 있던 금 지팡이를 너에게 내민다. 너는 다가가서 그 끝을 만진다.'),
    S('아하수에로','왕비 에스더여, 무슨 일이오? 무엇을 원하오? 이 나라의 절반이라도 주겠소.'),
    T('살았다. 그런데 여기서가 진짜다. 이 방에는 둘뿐이지만, 방 밖에는 <b>왕의 도장 반지를 낀 사람</b>이 있다. 지금 그 이름을 부르면, 그 사람에게는 변명할 하룻밤이 생긴다.'),
    M(MUSTBOX),
    B('에스더 5:2~8', '에스더가 두 번이나 미루고 잔치로 부른 대목')
  ],
  c:[
    {tag:'잔치에 부른다', x:'오늘 제가 잔치를 차렸으니 하만과 함께 와 달라고 청한다. 말은 나중에 하겠다고.',
     e:{mang:1, ui:-1}, canon:true,
     b:'에스더는 그 자리에서 말하지 않고 잔치에 초대했다. 그리고 잔치에서 한 번 더 미뤘다. 그 하루가 6장의 밤을 만들었다.', bref:'에 5:4, 5:8',
     echo:'왕이 하만을 급히 불러오게 했다. 하만은 왕비의 잔치에 불린 단 한 명의 신하가 되었다.', to:'a5-3'},
    {tag:'지금 고발한다', x:'지금 바로 말한다. 반지를 낀 사람이 내 민족을 팔았다고.',
     e:{dam:2, ui:3}, to:'E.night'},
    {tag:'하만을 뺀다', x:'하만은 빼고 왕에게만 따로 말할 자리를 달라고 한다.',
     e:{mang:1, ui:2}, to:'E.night'}
  ]},

'a5-3':{act:5, title:'첫 번째 잔치',
  t:[
    P('술을 마실 때 왕이 또 묻는다. 무엇을 원하느냐고. 나라의 절반이라도 주겠다고.'),
    P('너는 한 번 더 미룬다. 내일 왕과 하만이 다시 와 주시면 그때 말씀드리겠다고.'),
    P('하만은 기분이 좋아서 나간다. 그러다 왕궁 문에서 모르드개를 본다. 모르드개는 일어나지도 않고 꿈쩍도 하지 않는다. 하만은 화가 머리끝까지 난다.'),
    P('집에 돌아가 친구들과 아내 세레스를 불러 놓고 자기 자랑을 한다. 재산이며 자식이며, 왕이 자기를 제일 높은 자리에 올려 준 일까지.'),
    S('하만','왕비님 잔치에 불린 신하는 나 하나뿐이오. 내일도 또 불렀소. 그런데 저 유대인 모르드개가 문에 앉아 있는 걸 보면, 이 모든 게 하나도 기쁘지 않소.'),
    S('세레스','22미터짜리 나무를 세우세요. 내일 왕께 모르드개를 거기 매달게 해 달라고 하시고, 그다음에 기분 좋게 잔치에 가시면 되잖아요.'),
    P('하만은 그 말이 마음에 들었다. 그래서 나무를 세웠다.'),
    B('에스더 5:9~14', '오십 규빗 나무를 세운 대목. 오십 규빗은 약 22미터다.')
  ],
  c:[{go:true, x:'그 밤에', to:'a6-1'}]},

/* ── 6막 ───────────────────────────────────────── */

  t:[
    P('그 밤에 왕은 잠이 오지 않았다.'),
    P('에스더기에서 제일 짧은 문장이다. 왜 잠이 안 왔는지는 적혀 있지 않다. 이 책에는 기적이 한 번도 안 나온다. 나오는 건 우연뿐이다.'),
    P('왕비의 방도 등불이 꺼지지 않는다. 내일 무슨 일이 일어날지 아무도 모른다.'),
    P('이 밤을 어떻게 쓸까?'),
    B('에스더 6:1', '"이 밤에 왕이 잠이 오지 아니하므로" · 이 장면은 성경에 없다.')
  ],
  c:[
    {tag:'금식을 이어 간다', x:'사흘째 금식을 계속한다. 아무것도 하지 않고 아침까지 깨어 있는다.',
     e:{dam:2}, echo:'아무 일도 일어나지 않았다. 아무것도 하지 않은 채로 너는 아침을 봤다.',
     to: st => st.flags.credit ? 'a6-2' : 'a6-2n'},
    {tag:'하르보나를 부른다', x:'신하 하르보나를 부른다. 하만의 집 마당에서 밤새 망치 소리가 난다는 말을 들었다.',
     e:{mang:2}, f:{harbona:true},
     echo:'하르보나가 새벽에 돌아왔다. 22미터라고 했다. 성벽 위에서도 보일 높이라고.',
     to: st => st.flags.credit ? 'a6-2' : 'a6-2n'},
    {tag:'헤개를 부른다', x:'나이 든 헤개를 부른다. 오늘 밤 왕의 방은 어떤지 묻는다.',
     e:{chong:1, mang:1}, echo:'헤개가 말했다. 왕이 잠이 안 와서 기록책을 가져오게 했다고.',
     to: st => st.flags.credit ? 'a6-2' : 'a6-2n'}
  ]},

'a6-2':{act:6, title:'기록책',
  t:[
    P('왕이 기록책을 가져오게 해서 읽게 한다. 서기관이 두루마리를 편다. 몇 년 전 기록, 그다음 해 기록. 그러다 한 줄에 닿는다.'),
    P('문을 지키던 신하 두 명이 왕을 죽이려 한 것을 모르드개가 알렸다는 줄이다.'),
    S('아하수에로','이 일로 모르드개에게 무슨 상을 주었느냐?'),
    S('신하들','아무것도 주지 않았습니다.'),
    T('<b>2막에서 네가 오빠 이름으로 알렸기 때문이다.</b> 왕에게 잘 보일 수도 있었던 그 밤에, 너는 공을 네 것으로 하지 않았다. 그 선택이 지금 돌아왔다.'),
    B('에스더 6:1~3', '기록책에서 모르드개의 이름이 나오는 대목')

  c:[{go:true, x:'새벽에, 뜰에서 발소리가 난다', to:'a6-3'}]},

  t:[
    P('왕이 기록책을 가져오게 해서 읽게 한다. 서기관이 두루마리를 편다. 왕을 죽이려던 계획 이야기도 거기 있다.'),
    P('그런데 그 줄에는 왕비의 이름이 적혀 있다. 아니면 아무 이름도 없다. 왕궁 문 앞에 앉은 사람의 이름은 그 두루마리 어디에도 없다.'),

    P('두루마리가 넘어간다. 바깥에서는 밤새 망치 소리가 났다. 22미터는 성벽 위에서도 보이는 높이다.'),
    B('에스더 6:2', '성경에서는 바로 이 줄에 모르드개의 이름이 적혀 있다.')

'a6-3':{act:6, title:'왕이 기뻐하는 사람',
  t:[
    P('하만이 아침 일찍 바깥뜰에 들어온다. 자기가 세운 나무에 모르드개를 매달게 해 달라고 청하러 온 것이다.'),
    P('왕이 먼저 묻는다. 내가 아주 기쁘게 해 주고 싶은 사람이 있는데, 어떻게 해 주면 좋겠느냐고.'),
    P('하만은 속으로 생각한다. 나 말고 누구를 그렇게 해 주시겠어?'),
    S('하만','왕의 옷을 입히시고, 왕의 말에 태우시고, 머리에 왕관을 씌우십시오. 그리고 제일 높은 신하 한 명에게 말고삐를 잡게 해서 성안 거리를 돌며 외치게 하십시오.'),
    S('아하수에로','좋다. 그럼 네 말대로 빨리 그렇게 해라. 왕궁 문에 앉아 있는 유대인 모르드개에게. 네가 말한 것 중에 하나도 빠뜨리지 말고.'),
    P('하만은 모르드개를 말에 태우고 성안 거리를 돌며 그 말을 외친다. 그러고는 머리를 싸매고 집으로 돌아간다.'),
    S('세레스','모르드개가 유대인이라면, 당신은 이제 그 사람을 못 이겨요. 지는 쪽은 당신이에요.'),
    P('그 말이 끝나기도 전에 왕의 신하들이 와서 하만을 왕비의 잔치로 데려간다.'),
    B('에스더 6:4~14', '하만이 제 입으로 고른 영예를 원수에게 입힌 대목')
  ],
  c:[{go:true, x:'두 번째 잔치', to:'a7-1'}]},

/* ── 7막 ───────────────────────────────────────── */

  onEnter: st => {
    if(st.ui >= 6){ st.chong = Math.max(0, st.chong - 1); return {chong:-1}; }
    return null;
  },
  t:[
    P('왕과 하만이 왕비의 잔치 자리에 온다. 둘째 날에도 술을 마실 때 왕이 또 묻는다.'),
    S('아하수에로','왕비 에스더여, 무엇을 원하오? 말만 하면 들어주겠소. 이 나라의 절반이라도.'),
    P('하만이 상 건너편에 앉아 있다. 그는 오늘 아침에 모르드개를 말에 태웠고, 왜 그런 일이 생겼는지 아직 모른다.'),
    P('이제 한 문장이면 된다. 그 한 문장을 어떻게 세울까?'),
    B('에스더 7:1~6', '세 가지 다 에스더가 실제로 한 말 안에 들어 있다. 순서만 다르다.')
  ],
  cond:[
    {when:st => st.ui >= 6, t:[
      T('하만의 의심이 너무 높았다. 그는 오는 길에 왕에게 왕비의 출신이 수상하다고 귀띔해 두었다. <b>왕의 마음이 1 깎였다.</b>')]}
  ],
  c:[
    {tag:'손해를 말한다', x:'저와 제 민족이 팔려서 죽게 되었습니다. 그냥 노비로 팔렸다면 가만히 있었을 겁니다.',
     e:{mang:1},
     b:'에스더가 제일 먼저 꺼낸 말이다. 왕은 셈을 하는 사람이었다.', bref:'에 7:4',
     echo:'왕은 셈을 하는 사람이다. 하만이 내겠다던 돈이 그의 머릿속에서 다시 계산되기 시작했다.', to:'a7-2'},
    {tag:'내 민족이라고 말한다', x:'제 목숨을 살려 주시고, 제 민족도 살려 주십시오. 그 민족이 바로 제 민족입니다.',
     e:{dam:2},
     b:'에스더가 한 말이다. 성경에서는 손해 이야기를 먼저 꺼낸 다음이었다.', bref:'에 7:3~4',
     echo:'그 방에서 처음으로, 왕비가 어느 민족인지를 입 밖에 낸 사람은 왕비 자신이었다.', to:'a7-2'},
    {tag:'이름을 부른다', x:'그 사람은 바로 이 하만입니다.',
     e:{dam:1, chong:-1},
     b:'에스더가 한 말이다. 성경에서는 왕이 먼저 "그가 누구냐"고 물은 다음이었다.', bref:'에 7:5~6',
     echo:'하만이 왕과 왕비 앞에서 벌벌 떨었다. 이름이 불린 순간에만 사람은 그렇게 작아진다.', to:'a7-2'}
  ]},

'a7-2':{act:7, title:'정원으로 나간 왕',
  t:[
    P('왕이 화가 나서 일어나 정원으로 나간다. 아직 결정하지 못한 것이다. 반지를 준 것도 자기고, 그 편지를 허락한 것도 자기니까.'),
    P('하만은 왕비에게 매달려 목숨을 구걸한다. 왕이 자기를 어떻게 할지 이미 마음먹은 걸 봤기 때문이다.'),

function rosette(){

function drawMeters(deltas){
  $('meters').innerHTML = STATS.map((s,i) => {
    const v = Math.max(0, Math.min(MAX, st[s.k]));
    const d = deltas && deltas[s.k];
    return '<button class="meter' + (s.danger?' danger':'') + '" data-s="' + i + '" title="' + s.desc + '">' +
      (d ? '<span class="delta' + (d<0?' down':'') + '">' + (d>0?'+':'') + d + '</span>' : '') +
      '<span class="val">' + v + '</span><span class="nm">' + s.name + '</span>' +
      '<span class="bar"><i style="width:' + (v/MAX*100) + '%"></i></span></button>';
  }).join('');
  $('meters').querySelectorAll('.meter').forEach(b => b.addEventListener('click', openHow));
}

function drawCrown(act, deltas){
  crown.hidden = false; tools.hidden = false;
  $('actMark').innerHTML = '<b>' + act + '막</b> · ' + ACTS[act].title;
  $('pips').innerHTML = Array.from({length:10}, (_,i) => {
    const n = i+1;
    return '<span class="pip' + (n<act?' on':'') + (n===act?' now':'') + '"></span>';
  }).join('');
  drawMeters(deltas);
}

function gloss(s, used){
  DICT_KEYS.forEach(k => {
    if(used.has(k)) return;
    const i = s.indexOf(k);
    if(i < 0) return;
    if(s.lastIndexOf('<', i) > s.lastIndexOf('>', i)) return;
    used.add(k);
    s = s.slice(0,i) + '<b class="gl" data-w="' + k + '" tabindex="0" role="button">' + k + '</b>' + s.slice(i + k.length);
  });
  return s;
}

function renderText(arr){
  const used = new Set();
  let html = '';
  if(bnote){
    html += '<p class="bnote' + (bnote.same ? ' same' : '') + '"><b>' +
      (bnote.same ? '성경과 같은 선택이에요' : '성경에서는') + '</b>' +
      bnote.text + ' <span style="color:var(--gold)">(' + bnote.ref + ')</span></p>';
  }
  if(echoLine) html += '<p class="echo">' + gloss(echoLine, used) + '</p>';
  arr.forEach(x => {
    if(!x) return;
    if(typeof x === 'function') x = x(st);
    if(typeof x === 'string'){ html += '<p>' + gloss(x, used) + '</p>'; }
    else if(x.bible){ html += '<p class="bible">📖 <b>' + x.bible + '</b> — ' + x.what + '</p>'; }
    else if(x.quote){ html += '<p class="quote">' + x.quote + '<em>' + x.ref + '</em></p>'; }
    else if(x.must){ html += '<p class="must">' + x.must + '</p>'; }
    else if(x.tip){ html += '<p class="tip">' + gloss(x.tip, used) + '</p>'; }
    else if(x.who){ html += '<p class="said"><b>' + x.who + '</b>' + gloss(x.line, used) + '</p>'; }
  });
  return html;
}

function fxChips(e){
  if(!e) return '';
  const names = {}; STATS.forEach(s => names[s.k] = s.name);
  const parts = Object.keys(e).filter(k => e[k]).map(k =>
    '<span' + (e[k] < 0 ? ' class="down"' : '') + '>' + names[k] + ' ' + (e[k]>0?'+':'') + e[k] + '</span>');
  return parts.length ? '<span class="fx">' + parts.join('') + '</span>' : '';
}

function stagger(){
  stage.querySelectorAll('.passage p, .choice').forEach((el,i) => {
    el.style.animationDelay = Math.min(i*70, 700) + 'ms';
  });
}

function showScene(id, deltas){
  cur = id;
  const sc = SCENES[id];
  if(!sc){ showEnding(id); return; }
  st.at = id;

  if(sc.onEnter && !st.flags['on:' + id]){
    st.flags['on:' + id] = true;
    const d = sc.onEnter(st);
    if(d) deltas = Object.assign({}, deltas || {}, d);
  }
  drawCrown(sc.act, deltas);

  let body = sc.t.slice();
  if(sc.cond) sc.cond.forEach(c => { if(c.when(st)) body = body.concat(c.t); });
  const refs = body.filter(x => x && x.bible);
  if(refs.length) body = body.filter(x => !(x && x.bible)).concat(refs);

  const choices = sc.c.map((c,i) => {
    if(c.go) return '<button class="choice go" data-i="' + i + '">' + c.x + ' →</button>';
    const ok = !c.req || c.req(st);
    if(!ok){
      const why = typeof c.lock === 'function' ? c.lock(st) : c.lock;
      return '<button class="choice locked" data-i="' + i + '" disabled aria-disabled="true">' +
        '<span class="tag">아직 고를 수 없음 · ' + c.tag + '</span>' + why + '</button>';
    }
    return '<button class="choice" data-i="' + i + '"><span class="tag">' + c.tag + '</span>' +
      c.x + fxChips(c.e) + '</button>';
  }).join('');

  stage.innerHTML = '<section class="panel"><h2 class="scene-title">' + sc.title + '</h2>' +
    '<div class="passage">' + renderText(body) + '</div>' +
    '<div class="choices">' + choices + '</div></section>';
  echoLine = ''; bnote = null; st.echo = ''; st.bn = null;
  stagger(); bindGloss();
  stage.querySelectorAll('.choice:not(.locked)').forEach(b => {
    b.addEventListener('click', () => pick(sc, +b.dataset.i));
  });
  window.scrollTo({top:0, behavior:'smooth'});
  save();
}

function pick(sc, i){
  const c = sc.c[i];
  const deltas = {};
  if(c.e) for(const k in c.e){
    st[k] = Math.max(0, Math.min(MAX, st[k] + c.e[k]));
    deltas[k] = c.e[k];
  }
  if(c.f) Object.assign(st.flags, c.f);
  if(!c.go) st.log.push({act:sc.act, what:c.tag + ' — ' + sc.title,
                         mark: sc.must ? (c.canon ? 'o' : 'x') : ''});
  echoLine = c.echo || ''; st.echo = echoLine;
  bnote = c.b ? {text:c.b, ref:c.bref, same:!!c.canon} : null;
  st.bn = bnote;

  const next = typeof c.to === 'function' ? c.to(st) : c.to;
  const resolved = next === 'ENDING' ? judge() : next;
  const nextAct = SCENES[resolved] ? SCENES[resolved].act : null;

  if(nextAct && nextAct !== sc.act) curtainTo(nextAct, resolved, deltas);
  else showScene(resolved, deltas);
}

function curtainTo(act, id, deltas){
  CP[act] = clone(st);
  const prev = ACTS[act - 1];
  const el = $('curtain');
  el.innerHTML = '<div class="in">' + rosette() +
    '<div class="no">' + act + '막</div><h2>' + ACTS[act].title + '</h2>' +
    '<div class="ref">' + ACTS[act].ch + '</div>' +
    (prev ? '<div class="reading">📖 <b>' + ACTS[act-1].ch + '</b>을 지나왔습니다.<br>성경을 펴면 <b>' +
      ACTS[act-1].verses + '</b>을 꼭 보세요.</div>' : '') +
    '<div class="skip">아무 데나 누르면 넘어갑니다</div></div>';
  el.hidden = false;
  let done = false;
  const go = () => {
    if(done) return; done = true;
    el.hidden = true; el.removeEventListener('click', go);
    showScene(id, deltas);
  };
  el.addEventListener('click', go);
  setTimeout(go, prev ? 4600 : 2600);
}

function whyList(){
  const L = [];
  st.log.filter(l => l.mark).forEach(l =>
    L.push('<li' + (l.mark === 'x' ? ' class="no"' : '') + '><b>' + l.act + '막 ' +
      (l.mark === 'o' ? '성경대로' : '성경과 다르게') + '</b> — ' + l.what + '</li>'));
  if(st.flags.harbona) L.push('<li><b>6막</b> — 하르보나를 미리 보냈다</li>');
  L.push('<li>궁궐 사람들 <b>' + st.mang + '</b> · 용기 <b>' + st.dam + '</b> · 하만의 의심 <b>' + st.ui + '</b></li>');
  return '<div class="why"><h4>성경과 맞춰 보기</h4><ul>' + L.join('') + '</ul></div>';
}

function showEnding(id){
  cur = id; st.at = id;
  const e = ENDINGS[id];
  crown.hidden = true;
  const tal = STATS.map(s => '<div><span class="k">' + s.name + '</span><span class="v">' + st[s.k] + '</span></div>').join('');
  const canGoBack = e.sad && e.back && CP[e.back];

  stage.innerHTML = '<section class="panel ending' + (e.sad ? ' sad' : '') + '">' +
    '<div style="text-align:center">' + rosette() + '</div>' +
    '<span class="stamp' + (e.sad ? ' off' : '') + '">' +
      (e.sad ? '이 결말은 성경에 없습니다' : '성경대로 갔습니다') + '</span>' +
    (e.sad ? '<div class="over">이 야 기 는 여 기 서 끝 났 습 니 다</div>' : '') +
    '<div class="kicker">' + e.kicker + '</div><h2>' + e.title + '</h2>' +
    '<p class="epi">' + e.epi + '</p>' +
    '<div class="passage">' + renderText(e.t) + '</div>' +
    '<p style="margin:2.2rem 0 0;color:var(--gold-2)">' + e.verdict + '</p>' +
    '<div class="says"><h4>📖 성경에서는 이렇게 됩니다</h4>' +
      e.says.map(p => '<p>' + p + '</p>').join('') +
      '<p class="ref">' + e.saysRef + '</p></div>' +
    whyList() +
    '<div class="tally">' + tal + '</div>' +
    '<div class="choices">' +
      '<button class="choice restart" id="again">1막부터 처음부터 다시 시작한다</button>' +
      (canGoBack ? '<button class="choice restart" id="rewind">' + e.back + '막으로 돌아간다 — ' + e.backWhy + '</button>' : '') +
    '</div>' +
    '<div class="menu"><button class="btn quiet" id="seelog">내가 고른 것들</button>' +
    '<button class="btn quiet" id="seenote">진짜 성경 이야기</button></div></section>';
  tools.hidden = false;
  stagger(); bindGloss();
  $('again').addEventListener('click', start);
  if(canGoBack) $('rewind').addEventListener('click', () => {
    st = clone(CP[e.back]); echoLine = ''; bnote = null;
    Object.keys(CP).forEach(k => { if(+k > e.back) delete CP[k]; });
    curtainTo(e.back, ACT_FIRST[e.back], null);
  });
  $('seelog').addEventListener('click', openLog);
  $('seenote').addEventListener('click', openNotes);
  window.scrollTo({top:0, behavior:'smooth'});
  wipe();
}

function bindGloss(){
  document.querySelectorAll('.gl').forEach(el => {
    if(el.dataset.bound) return;
    el.dataset.bound = '1';
    const show = ev => {
      ev.stopPropagation();
      const w = el.dataset.w, d = DICT_MAP[w];
      if(!d) return;
      pop.innerHTML = '<b>' + w + '</b>' + d.d + (d.r ? '<span class="ref">📖 ' + d.r + '</span>' : '');
      pop.hidden = false;
      const r = el.getBoundingClientRect();
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      const x = Math.min(Math.max(8, r.left), window.innerWidth - pw - 8);
      let y = r.bottom + 8;
      if(y + ph > window.innerHeight - 8) y = Math.max(8, r.top - ph - 8);
      pop.style.left = x + 'px'; pop.style.top = y + 'px';
    };
    el.addEventListener('click', show);
    el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); show(e); } });
  });
}

$('btnHow').addEventListener('click', openHow);
$('btnDict').addEventListener('click', openDict);
$('btnLog').addEventListener('click', openLog);
$('btnNote').addEventListener('click', openNotes);
$('btnReset').addEventListener('click', () => { wipe(); titleScreen(); });

/* ─────────────── 부팅 ─────────────── */
function boot(data){
  if(data && data.st && data.cur){
    st = data.st; CP = data.CP || {}; echoLine = st.echo || ''; bnote = st.bn || null;
    if(ENDINGS[data.cur]) showEnding(data.cur);
    else if(SCENES[data.cur]) showScene(data.cur);
    else titleScreen();
  } else titleScreen();
}
try{
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(() => (st && cur) ? {st, cur, CP} : null);
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data);
  } else boot(null);
}catch(e){ boot(null); }

})();
</script>
